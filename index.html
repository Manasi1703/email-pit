<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>unanswered emails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" />
    <style>html, body { margin: 0; background: #f3f0ea; }</style>
  </head>
  <body>
    <canvas id="gl" aria-label="A heap of unanswered emails. Move the pointer over it to dig through it; click a paper or envelope to read it."></canvas>
    <header class="hud">
      <h1 class="hud-title">unanswered emails</h1>
      <p class="hud-sub">Hover to ruffle through the heap. Click any paper to read it.</p>
    </header>
    <div class="counter" role="status" aria-live="off" aria-label="Unread emails">
      <span class="counter-dot" aria-hidden="true"></span>
      <span class="counter-label">Unread</span>
      <span class="counter-num" id="count"></span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
